<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Velocity v2 — Admin</title>
<meta http-equiv="refresh" content="5">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 2rem; background: #f7f7f8; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  .summary { display: flex; gap: 2rem; margin-bottom: 1.5rem; }
  .summary div { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem 1.25rem; }
  .summary .label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }
  .summary .value { font-size: 1.3rem; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
  th, td { text-align: left; padding: 0.5rem 0.9rem; border-bottom: 1px solid #eee; }
  th { background: #fafafa; font-size: 0.8rem; text-transform: uppercase; color: #666; }
  tr.status-ok td.status { color: #1a7f37; font-weight: 600; }
  tr.status-down td.status, tr.status-degraded td.status, tr.status-unhealthy td.status { color: #cf222e; font-weight: 600; }
  a { color: #0969da; }
  .footer { margin-top: 1.5rem; font-size: 0.8rem; color: #666; }
</style>
</head>
<body>
<h1>Velocity v2 — Admin</h1>

<div class="summary">
  <div><div class="label">Plugins tracked</div><div class="value">{{.PluginCount}}</div></div>
  <div><div class="label">Uptime</div><div class="value">{{.Uptime}}</div></div>
</div>

<table>
  <thead><tr><th>Plugin</th><th>Status</th><th>Detail</th></tr></thead>
  <tbody>
  {{range .Plugins}}
    <tr class="status-{{.Status}}">
      <td>{{.Name}}</td>
      <td class="status">{{.Status}}</td>
      <td>{{.Detail}}</td>
    </tr>
  {{else}}
    <tr><td colspan="3">No dependency health data available.</td></tr>
  {{end}}
  </tbody>
</table>

<div class="footer">
  Page auto-refreshes every 5s.
  {{if .HasMetrics}}&middot; <a href="/metrics">Prometheus metrics</a>{{end}}
  &middot; <a href="/readyz">/readyz</a> &middot; <a href="/healthz">/healthz</a>
</div>
</body>
</html>
